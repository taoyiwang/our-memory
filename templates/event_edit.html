{% extends "base.html" %}

{% block title %}编辑回忆 · doubledate的冒险{% endblock %}

{% block body %}
<div class="max-w-2xl mx-auto px-5 pt-16 pb-32">
    <header class="flex items-center justify-between mb-8">
        <h1 class="font-serif text-3xl text-ink">编辑回忆</h1>
        <a href="{{ url_for('event.detail', event_id=event.id) }}"
           class="text-sm text-ink-mute hover:text-ink/60">取消</a>
    </header>

    <form method="post" action="{{ url_for('event.update', event_id=event.id) }}" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div>
            <label class="block text-sm font-medium text-ink-soft mb-1">标题</label>
            <input type="text" name="title" value="{{ event.title }}"
                   class="w-full rounded-xl border-ink/10 bg-cream/50 px-4 py-3 text-ink focus:ring-2 focus:ring-accent/30 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-ink-soft mb-1">日期</label>
            <input type="date" name="event_date" value="{{ event.event_date }}"
                   class="w-full rounded-xl border-ink/10 bg-cream/50 px-4 py-3 text-ink focus:ring-2 focus:ring-accent/30 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-ink-soft mb-1">地点</label>
            <input type="text" name="location" value="{{ event.location or '' }}"
                   class="w-full rounded-xl border-ink/10 bg-cream/50 px-4 py-3 text-ink focus:ring-2 focus:ring-accent/30 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-ink-soft mb-1">正文</label>
            <textarea name="content" rows="6"
                      class="w-full rounded-xl border-ink/10 bg-cream/50 px-4 py-3 text-ink focus:ring-2 focus:ring-accent/30 focus:outline-none">{{ event.content or '' }}</textarea>
        </div>

        <button type="submit"
                class="w-full h-12 rounded-2xl bg-accent text-white font-medium shadow-[0_10px_30px_rgba(217,125,84,0.3)] active:scale-[0.98] transition-transform">
            保存修改
        </button>
    </form>
</div>
{% endblock %}
