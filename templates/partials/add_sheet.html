{# 新增回忆 Bottom Sheet —— Alpine 上滑过渡 #}
<div id="add-sheet"
     x-show="openAdd"
     x-transition.opacity.duration.200ms
     x-cloak
     class="fixed inset-0 z-50">

  <!-- 遮罩 -->
  <div class="absolute inset-0 bg-stone-900/40 backdrop-blur-sm"
       x-show="openAdd"
       x-transition.opacity.duration.200ms
       @click="openAdd = false"></div>

  <!-- 面板（底部滑入，弹性缓动） -->
  <div class="absolute bottom-0 inset-x-0 bg-paper rounded-t-[2.5rem] shadow-2xl
              max-h-[88vh] overflow-y-auto"
       x-show="openAdd"
       x-transition:enter="transition ease-out duration-400"
       x-transition:enter-start="translate-y-full"
       x-transition:enter-end="translate-y-0"
       x-transition:leave="transition ease-in duration-250"
       x-transition:leave-start="translate-y-0"
       x-transition:leave-end="translate-y-full"
       style="padding-bottom: env(safe-area-inset-bottom, 0px)">

    <!-- 拖拽条 -->
    <div class="pt-4 pb-2 flex items-center justify-center">
      <div class="w-10 h-1.5 rounded-full bg-ink/15"></div>
    </div>

    <h2 class="px-6 font-serif text-xl font-medium text-ink">新增回忆</h2>

    <form method="post" action="{{ url_for('event.new') }}" class="px-6 py-4 space-y-4"
          enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <!-- 日期 -->
      <div>
        <label class="text-sm text-ink-soft mb-1.5 block">日期</label>
        <input type="date" name="event_date" value="{{ today }}"
               class="w-full h-12 px-4 rounded-xl bg-cream-deep border border-ink/5 outline-none
                      focus:ring-2 focus:ring-accent/40 transition">
      </div>

      <!-- 标题 -->
      <div>
        <label class="text-sm text-ink-soft mb-1.5 block">标题</label>
        <input type="text" name="title" required placeholder="今天吃饭"
               class="w-full h-12 px-4 rounded-xl bg-cream-deep border border-ink/5 outline-none
                      focus:ring-2 focus:ring-accent/40 transition">
      </div>

      <!-- 地点 -->
      <div>
        <label class="text-sm text-ink-soft mb-1.5 block">地点</label>
        <input type="text" name="location" placeholder="南京"
               class="w-full h-12 px-4 rounded-xl bg-cream-deep border border-ink/5 outline-none
                      focus:ring-2 focus:ring-accent/40 transition">
      </div>

      <!-- 描述 -->
      <div>
        <label class="text-sm text-ink-soft mb-1.5 block">写点什么…</label>
        <textarea name="content" rows="3" placeholder="记录当时的心情"
                  class="w-full px-4 py-3 rounded-xl bg-cream-deep border border-ink/5 outline-none
                         focus:ring-2 focus:ring-accent/40 transition resize-none"></textarea>
      </div>

      <!-- 照片上传 -->
      <div>
        <label class="text-sm text-ink-soft mb-1.5 block">照片</label>
        <label for="add-photos"
               class="flex flex-col items-center justify-center h-24 rounded-xl border-2 border-dashed border-ink/15
                      bg-cream-deep/50 cursor-pointer transition hover:border-accent/60">
          <span class="text-2xl">📷</span>
          <span class="text-xs text-ink-mute mt-1">点击选择照片</span>
        </label>
        <input type="file" name="photos" id="add-photos" multiple accept="image/*"
               data-preview-target="#add-preview" class="hidden">
        <!-- 预览区 -->
        <div id="add-preview" class="mt-3 grid grid-cols-3 gap-2"></div>
      </div>

      <button type="submit"
              class="w-full h-13 py-4 rounded-2xl bg-accent text-white font-medium
                     active:scale-[0.98] transition-transform duration-150 shadow-[0_10px_30px_rgba(217,125,84,0.3)]">
        保存回忆
      </button>
    </form>
  </div>
</div>
