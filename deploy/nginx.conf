# Nginx 站点配置 —— 我们的故事（私人回忆时间轴）
# 放置到 /etc/nginx/sites-available/timeline 并软链到 sites-enabled
# 请把域名改为你的真实域名

server {
    listen 80;
    server_name your-domain.com;

    # 上传限制（Flask 侧 MAX_CONTENT_LENGTH = 15MB * 20 = 300MB）
    client_max_body_size 300m;

    # 请求体超时（多图上传较慢）
    client_body_timeout 120s;

    # 静态资源由 Nginx 直接服务
    location /static/ {
        alias /var/www/timeline/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 其余请求代理到 Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 生产环境建议启用 HTTPS（Let's Encrypt / 阿里云免费证书），并将 80 重定向到 443
