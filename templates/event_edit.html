{% extends "base.html" %}

{% block title %}编辑回忆 · {{ event.title }}{% endblock %}

{% block head %}
<style>
  /* 隐藏系统原生日期框多余杂质，保留手账手写感 */
  input[type="date"]::-webkit-calendar-picker-indicator {
    opacity: 0.5;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  input[type="date"]::-webkit-calendar-picker-indicator:hover {
    opacity: 0.9;
  }
</style>
{% endblock %}

{% block body %}
<div class="min-h-screen pb-24" x-data='{ content: {{ (event.content or '') | tojson }} }'>

  <!-- 顶部导航：限制在 max-w-lg 内居中 -->
  <div class="sticky top-0 z-30 bg-gradient-to-b from-[#fcfaf6] via-[#fcfaf6]/90 to-transparent backdrop-blur-sm">
    <nav class="max-w-lg mx-auto px-4 pt-4 pb-3 flex items-center justify-between">
      <a href="{{ url_for('event.detail', event_id=event.id) }}"
         class="w-10 h-10 rounded-full bg-white card-shadow flex items-center justify-center text-ink active:scale-90 transition">
        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </a>
      <span class="font-serif text-sm text-ink-mute tracking-widest">编辑回忆</span>
      <a href="{{ url_for('event.detail', event_id=event.id) }}"
         class="text-xs font-hand text-ink-mute hover:text-ink transition px-2 py-1">
        取消
      </a>
    </nav>
  </div>

  <!-- 主表单区域：居中精致信纸卡片 -->
  <div class="max-w-lg mx-auto px-4 pt-2">
    <form method="post" action="{{ url_for('event.update', event_id=event.id) }}" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <!-- 表单信纸大卡片 -->
      <div class="bg-white rounded-3xl p-6 card-shadow space-y-5">
        
        <!-- 标题 -->
        <div class="space-y-1.5">
          <label class="block text-xs font-hand text-ink-mute">回忆标题 <span class="text-accent">*</span></label>
          <input type="text" name="title" value="{{ event.title }}" required
                 placeholder="给这段时光起个名字…"
                 class="w-full bg-[#fcfaf6] rounded-xl px-3.5 py-2.5 text-base font-serif text-ink placeholder:text-ink-mute/40 border border-transparent focus:border-accent/40 focus:bg-white focus:outline-none transition">
        </div>

        <!-- 日期与地点并排 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
          <!-- 日期 -->
          <div class="space-y-1.5">
            <label class="block text-xs font-hand text-ink-mute">发生日期 <span class="text-accent">*</span></label>
            <input type="date" name="event_date" value="{{ event.event_date }}" required
                   class="w-full bg-[#fcfaf6] rounded-xl px-3.5 py-2.5 text-sm font-hand text-ink-soft border border-transparent focus:border-accent/40 focus:bg-white focus:outline-none transition">
          </div>

          <!-- 地点 -->
          <div class="space-y-1.5">
            <label class="block text-xs font-hand text-ink-mute">地点</label>
            <div class="relative">
              <input type="text" name="location" value="{{ event.location or '' }}"
                     placeholder="在哪里？"
                     class="w-full bg-[#fcfaf6] rounded-xl pl-8 pr-3.5 py-2.5 text-sm text-ink-soft placeholder:text-ink-mute/40 border border-transparent focus:border-accent/40 focus:bg-white focus:outline-none transition">
              <svg viewBox="0 0 24 24" class="w-4 h-4 text-accent absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <circle cx="12" cy="11" r="2.5"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- 正文故事 -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <label class="block text-xs font-hand text-ink-mute">写下细节</label>
            <span class="text-[11px] font-hand text-ink-mute/50" x-text="content.length + ' 字'"></span>
          </div>
          <textarea name="content" rows="6" x-model="content"
                    placeholder="记下那些珍贵的、不想忘记的细节…"
                    class="w-full bg-[#fcfaf6] rounded-xl p-3.5 text-sm leading-relaxed font-hand text-ink/80 placeholder:text-ink-mute/40 border border-transparent focus:border-accent/40 focus:bg-white focus:outline-none resize-none transition"></textarea>
        </div>

      </div>

      <!-- 操作按钮区域 -->
      <div class="pt-3 space-y-3">
        <button type="submit"
                class="w-full h-12 rounded-full bg-accent hover:bg-accent-soft text-white font-medium text-sm card-shadow
                       active:scale-[0.98] transition flex items-center justify-center gap-2">
          <span>保存修改</span>
        </button>

        <button type="button"
                onclick="if(confirm('确定要删除这段回忆吗？所有相关照片也会被清除且无法恢复。')) document.getElementById('delete-event-form').submit()"
                class="w-full py-2.5 text-center text-xs font-hand text-rose-500/70 hover:text-rose-600 transition">
          删除这段回忆
        </button>
      </div>
    </form>

    <!-- 隐藏删除表单 -->
    <form id="delete-event-form" method="post" action="{{ url_for('event.delete', event_id=event.id) }}" class="hidden">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    </form>
  </div>
</div>
{% endblock %}
