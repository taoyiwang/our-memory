{% extends "base.html" %}

{% block title %}编辑回忆 · doubledate的冒险{% endblock %}

{% block body %}
<div class="min-h-screen" x-data="{ content: '{{ event.content or '' }}' }">
  <!-- 顶部导航 -->
  <nav class="sticky top-0 z-30 flex items-center justify-between px-4 pt-4 pb-2
              bg-gradient-to-b from-cream to-transparent">
    <a href="{{ url_for('event.detail', event_id=event.id) }}"
       class="w-10 h-10 rounded-full bg-white/80 backdrop-blur card-shadow flex items-center justify-center
              active:scale-90 transition-transform">
      <svg viewBox="0 0 24 24" class="w-5 h-5 text-ink" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
    </a>
    <span class="font-hand text-sm text-ink-mute tracking-widest">编辑回忆</span>
    <a href="{{ url_for('event.detail', event_id=event.id) }}"
       class="text-sm text-ink-mute hover:text-ink/60 transition">取消</a>
  </nav>

  <!-- 表单 -->
  <div class="max-w-2xl mx-auto px-5 pt-6 pb-32">
    <form method="post" action="{{ url_for('event.update', event_id=event.id) }}" class="space-y-6">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <!-- 标题卡片 -->
      <div class="bg-white/80 backdrop-blur-sm rounded-2xl card-shadow p-5 space-y-1.5">
        <label class="block text-sm font-medium text-ink-soft">标题 <span class="text-ink-mute/50">· 必填</span></label>
        <input type="text" name="title" value="{{ event.title }}"
               placeholder="给这段回忆取个名字…"
               class="w-full bg-transparent border-b-2 border-ink/5 focus:border-accent/50 px-1 py-2 text-lg font-serif text-ink placeholder:text-ink-mute/30 focus:outline-none transition">
      </div>

      <!-- 日期卡片 -->
      <div class="bg-white/80 backdrop-blur-sm rounded-2xl card-shadow p-5 space-y-1.5">
        <label class="block text-sm font-medium text-ink-soft">日期 <span class="text-ink-mute/50">· 必填</span></label>
        <input type="date" name="event_date" value="{{ event.event_date }}"
               class="w-full bg-transparent border-b-2 border-ink/5 focus:border-accent/50 px-1 py-2 text-ink font-hand tracking-wider focus:outline-none transition">
      </div>

      <!-- 地点卡片 -->
      <div class="bg-white/80 backdrop-blur-sm rounded-2xl card-shadow p-5 space-y-1.5">
        <label class="block text-sm font-medium text-ink-soft">地点 <span class="text-ink-mute/50">· 选填</span></label>
        <input type="text" name="location" value="{{ event.location or '' }}"
               placeholder="在哪发生的？"
               class="w-full bg-transparent border-b-2 border-ink/5 focus:border-accent/50 px-1 py-2 text-ink placeholder:text-ink-mute/30 focus:outline-none transition">
      </div>

      <!-- 正文卡片 -->
      <div class="bg-white/80 backdrop-blur-sm rounded-2xl card-shadow p-5 space-y-1.5">
        <div class="flex items-center justify-between">
          <label class="block text-sm font-medium text-ink-soft">正文 <span class="text-ink-mute/50">· 选填</span></label>
          <span class="text-xs text-ink-mute/40" x-text="content.length + ' 字'"></span>
        </div>
        <textarea name="content" rows="8" x-model="content"
                  placeholder="写下那些不想忘记的细节…"
                  class="w-full bg-transparent border-b-2 border-ink/5 focus:border-accent/50 px-1 py-2 text-[15px] leading-relaxed text-ink/80 placeholder:text-ink-mute/30 focus:outline-none transition resize-y font-hand"></textarea>
      </div>

      <!-- 操作按钮 -->
      <div class="flex flex-col gap-3 pt-4">
        <button type="submit"
                class="w-full h-12 rounded-2xl bg-accent text-white font-medium shadow-[0_10px_30px_rgba(217,125,84,0.3)]
                       active:scale-[0.98] transition-transform hover:shadow-[0_14px_40px_rgba(217,125,84,0.4)]">
          ✨ 保存修改
        </button>
        <button type="button"
                onclick="if(confirm('确定删除这个回忆吗？删除后无法恢复。')) document.getElementById('delete-event-form').submit()"
                class="w-full h-10 rounded-xl text-rose-500/70 text-sm font-medium hover:text-rose-600 hover:bg-rose-50/50 transition">
          🗑️ 删除这个回忆
        </button>
      </div>
    </form>

    <!-- 删除表单（隐藏） -->
    <form id="delete-event-form" method="post" action="{{ url_for('event.delete', event_id=event.id) }}" class="hidden">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    </form>
  </div>
</div>
{% endblock %}
